name: KIN Life Guide Monitor

on:
  schedule:
    # GitHub Actions의 매시 정각 혼잡을 피하면서 30분 간격으로 07/37분에 실행합니다.
    - cron: '7,37 * * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kin-life-guide-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check new Naver Knowledge iN questions
        env:
          NAVER_API_HUB_CLIENT_ID: ${{ secrets.NAVER_API_HUB_CLIENT_ID }}
          NAVER_API_HUB_CLIENT_SECRET: ${{ secrets.NAVER_API_HUB_CLIENT_SECRET }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_URL_PROPERTY: ${{ vars.NOTION_URL_PROPERTY }}
          MONITOR_SCORE_THRESHOLD: ${{ vars.MONITOR_SCORE_THRESHOLD }}
          MONITOR_MAX_PAGES_PER_RUN: ${{ vars.MONITOR_MAX_PAGES_PER_RUN }}
          MONITOR_SEEDS_PER_RUN: ${{ vars.MONITOR_SEEDS_PER_RUN }}
          MONITOR_MAX_FOCUSED_PROMPTS_PER_RUN: ${{ vars.MONITOR_MAX_FOCUSED_PROMPTS_PER_RUN }}
          WORDPRESS_SITE_URL: ${{ vars.WORDPRESS_SITE_URL }}
          FOCUSED_RESEARCH_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail

          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/content-topic-research-next.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --max-time 2 http://127.0.0.1:3000/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "[오류] 로컬 Focused Research API가 60초 안에 시작되지 않았습니다."
            cat /tmp/content-topic-research-next.log
            exit 1
          fi

          node scripts/kin-life-guide-monitor.mjs
