name: im-not-ai Auto Update

on:
  schedule:
    - cron: '23 */6 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: im-not-ai-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest im-not-ai main
        run: node scripts/sync-im-not-ai.mjs

      - name: Detect upstream change
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- \
            vendor/im-not-ai \
            lib/im-not-ai-upstream-policy.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regression tests
        if: steps.diff.outputs.changed == 'true'
        run: npm run test:regression

      - name: ESLint
        if: steps.diff.outputs.changed == 'true'
        run: npm run lint

      - name: Production build
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit verified upstream update
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/im-not-ai lib/im-not-ai-upstream-policy.ts
          git commit -m "변경: im-not-ai 최신 규칙 자동 동기화"
          git push origin HEAD:main
